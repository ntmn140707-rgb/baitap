<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng Toán tử Rot (Curl)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            width: 500px;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .value-display {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .status-display {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 20px;
        }
        canvas {
            border: 1px solid #ddd;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="value-display" id="rotValText">Giá trị Rot (Curl): 7.0</div>
        <div class="status-display" id="statusText">Xoáy Ngược chiều kim đồng hồ (Mức độ: Vừa)</div>
        <input type="range" id="rotSlider" min="-15" max="15" step="0.5" value="7">
    </div>
    
    <canvas id="vectorCanvas" width="450" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById('vectorCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('rotSlider');
    const rotValText = document.getElementById('rotValText');
    const statusText = document.getElementById('statusText');

    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2;
    const scale = 40; // Tỷ lệ thu phóng không gian tọa độ

    // Hàm vẽ mũi tên vector
    function drawArrow(x1, y1, x2, y2) {
        const headLength = 6; // Độ dài đầu mũi tên
        const angle = Math.atan2(y2 - y1, x2 - x1);
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = 'rgba(65, 105, 225, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Vẽ đầu tam giác của mũi tên
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
        ctx.fillStyle = 'rgba(65, 105, 225, 0.8)';
        ctx.fill();
    }

    // Hàm cập nhật trạng thái hiển thị bằng chữ
    function updateStatus(rot) {
        rotValText.innerText = `Giá trị Rot (Curl): ${rot.toFixed(1)}`;
        
        let level = "Yếu";
        if (Math.abs(rot) > 10) level = "Mạnh";
        else if (Math.abs(rot) > 5) level = "Vừa";

        if (rot > 0) {
            statusText.innerText = `Xoáy Ngược chiều kim đồng hồ (Mức độ: ${level})`;
            statusText.style.color = "green";
        } else if (rot < 0) {
            statusText.innerText = `Xoáy Cùng chiều kim đồng hồ (Mức độ: ${level})`;
            statusText.style.color = "red";
        } else {
            statusText.innerText = "Trường tĩnh, không xoáy (Rot = 0)";
            statusText.style.color = "#555";
        }
    }

    // Hàm chính để vẽ toàn bộ lưới vector
    function render() {
        const rot = parseFloat(slider.value);
        ctx.clearRect(0, 0, width, height);
        
        // Vẽ lưới tọa độ mờ
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= width; i += 30) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
        }

        // Vẽ 2 trục chính Ox, Oy
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(width, centerY); ctx.stroke();

        updateStatus(rot);

        // Duyệt qua lưới điểm để vẽ các vector thành phần
        const step = 25; 
        for (let screenX = step; screenX < width; screenX += step) {
            for (let screenY = step; screenY < height; screenY += step) {
                
                // Bỏ qua điểm ở sát tâm quá để hình vẽ không bị rối
                if (Math.abs(screenX - centerX) < 15 && Math.abs(screenY - centerY) < 15) continue;

                // Đổi từ tọa độ màn hình (máy tính) sang tọa độ giải tích toán học Oxy
                const x = (screenX - centerX) / scale;
                const y = (centerY - screenY) / scale; // Trục Y trong toán hướng lên trên

                // CÔNG THỨC SỬA LỖI ĐẢO CHIỀU:
                // Theo đúng giải tích: U = -0.5 * Rot * y và V = 0.5 * Rot * x
                const u = -0.5 * rot * y;
                const v = 0.5 * rot * x;

                // Giới hạn độ dài hiển thị của mũi tên để đồ thị đẹp mắt, không đè lên nhau
                const vectorScale = 2.5; 
                
                // Đổi ngược vector (u, v) về lại tọa độ hiển thị của màn hình máy tính
                const targetScreenX = screenX + (u * vectorScale);
                const targetScreenY = screenY - (v * vectorScale); // Dấu trừ do trục Y màn hình chúc xuống

                drawArrow(screenX, screenY, targetScreenX, targetScreenY);
            }
        }
    }

    // Lắng nghe sự kiện kéo thanh trượt để vẽ lại hình ngay lập tức
    slider.addEventListener('input', render);
    
    // Chạy lần đầu tiên khi mở trang web
    render();
</script>

</body>
</html>
